  # Line 701: 4 nodes, start=60101, end=62001
  - id: 701
    name: "sub_TOP - J1 (line 1)"
    type: line
    voltage: "500000"
    node_refs: [60101, 70101, 70102, 62001]
    geometry:
      type: LineString
      coords:
        - (-84.301, 36.404)
        - (-84.301, 36.385)
