# Scenario: A-shaped triangular junction mesh with multi-node polylines.
#
# Terminal Topology:
#   sub_TOP --1,500kV--> J1
#   sub_TOP --1,500kV--> J1
#   J1 --1,500kV--> J2          (left leg, upper segment)
#   J1 --1,500kV--> J3          (right leg, upper segment)
#   J2 --2,161kV--> J3          (crossbar tying the two legs together)
#   J2 --3,500;161kV--> sub_LEFT   (left leg, lower segment)
#   J3 --3,500;161kV--> sub_RIGHT  (right leg, lower segment)
#
# Intermediate nodes have been inserted along every powerline corridor
# to test pipeline multi-node handling and endpoint vector calculation.

substations:
  - id: 201
    name: sub_TOP
    type: substation
    voltage: "500000"
    coords:
      - (-84.302, 36.402)
      - (-84.298, 36.402)
      - (-84.298, 36.406)
      - (-84.302, 36.406)
      - (-84.302, 36.402)
    node_refs: [50201, 50202, 50203, 50204, 50201]

  - id: 202
    name: sub_LEFT
    type: substation
    voltage: "500000;161000"
    coords:
      - (-84.402, 36.302)
      - (-84.398, 36.302)
      - (-84.398, 36.306)
      - (-84.402, 36.306)
      - (-84.402, 36.302)
    node_refs: [50205, 50206, 50207, 50208, 50205]

  - id: 203
    name: sub_RIGHT
    type: substation
    voltage: "500000;161000"
    coords:
      - (-84.202, 36.302)
      - (-84.198, 36.302)
      - (-84.198, 36.306)
      - (-84.202, 36.306)
      - (-84.202, 36.302)
    node_refs: [50209, 50210, 50211, 50212, 50209]

powerlines:
